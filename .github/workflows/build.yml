name: build

# - Every push / PR to gui or master: run the tests (macOS and Windows).
# - A version tag (v*): tests, build the macOS and Windows apps, and publish
#   both in one GitHub Release. The tag must match __version__ in
#   app/__init__.py.
# - Manual run (Actions tab -> build -> Run workflow, pick a branch): tests +
#   builds; the apps are uploaded as workflow artifacts only (no release).
on:
  push:
    branches: [gui, master]
    tags: ["v*"]
  pull_request:
    branches: [gui, master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

env:
  PYTHON_VERSION: "3.12"

defaults:
  run:
    shell: bash   # Git Bash on Windows runners

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6

      - name: Install Python and dependencies
        run: |
          uv venv --python "$PYTHON_VERSION" .venv/py312
          if [ "$RUNNER_OS" = "Windows" ]; then PY=.venv/py312/Scripts/python.exe; else PY=.venv/py312/bin/python; fi
          echo "PY=$PY" >> "$GITHUB_ENV"
          uv pip install --python "$PY" -r requirements-dev.txt

      - name: Run tests
        run: '"$PY" -m pytest -q'

  build:
    needs: test
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest      # Apple Silicon (arm64). TODO: Intel build (macos-13 runner or universal2).
            artifact: mrc2png-macos-arm64.zip
            bin: dist/mrc2png.app/Contents/MacOS/mrc2png
          - os: windows-latest    # x64; also runs on Windows 11 ARM through emulation.
            artifact: mrc2png-windows-x64.exe
            bin: dist/mrc2png-windows-x64.exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6

      - name: Install Python and dependencies
        run: |
          uv venv --python "$PYTHON_VERSION" .venv/py312
          if [ "$RUNNER_OS" = "Windows" ]; then PY=.venv/py312/Scripts/python.exe; else PY=.venv/py312/bin/python; fi
          echo "PY=$PY" >> "$GITHUB_ENV"
          uv pip install --python "$PY" -r requirements-dev.txt

      - name: Check that the tag matches the app version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          app_version=$("$PY" -c "import app; print(app.__version__)")
          if [ "v${app_version}" != "${GITHUB_REF_NAME}" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match __version__ = ${app_version} in app/__init__.py"
            exit 1
          fi

      - name: Build the app (macOS)
        if: runner.os == 'macOS'
        run: scripts/build_macos.sh "$PY"

      - name: Build the app (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: scripts/build_windows.ps1 -Python $env:PY

      - name: Smoke-test the packaged app (CLI mode)
        run: |
          bin="${{ matrix.bin }}"
          "$bin" --version
          "$PY" - <<'EOF'
          import mrcfile, numpy as np
          rng = np.random.default_rng(0)
          with mrcfile.new("smoke.mrc", overwrite=True) as m:
              m.set_data(rng.integers(0, 60000, (700, 900)).astype(np.uint16))
              m.voxel_size = 14.12
          EOF
          "$bin" convert -i smoke.mrc -o smoke_out
          test -s smoke_out/smoke_resized.png

      # TODO(signing): macOS: import a Developer ID certificate from secrets,
      # codesign with --options runtime, notarize (xcrun notarytool) and staple.
      # Windows: signtool with a code-signing certificate (see build_windows.ps1).

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist/${{ matrix.artifact }}
          if-no-files-found: error

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write       # needed to create the release
    steps:
      - name: Download all builds
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true

  # TODO: Linux build (ubuntu-latest, --onefile -> mrc2png-linux)
